<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ironcrown — Kingdom Strategy</title>
  <meta name="description" content="Build a kingdom on a hex world, research technologies, command divisions and fleets, explore ruins and conquer rival realms. Runs in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ===== Top HUD ===== -->
    <header id="hud">
      <div class="brand"><span class="crown">👑</span><div><b id="kingdom-name">Ironcrown</b><small id="hall-label">Main Hall 1</small></div></div>
      <div id="resources" class="resources"></div>
      <div class="hud-stats">
        <span class="chip" title="Season · day · year">📅 <b id="calendar">—</b></span>
        <span class="chip" title="Builders busy / total">🔨 <b id="builders">0/2</b></span>
        <span class="chip" title="Universities researching / total">🎓 <b id="research-chip">—</b></span>
        <span class="chip" title="Troops (all) / housing capacity">🛡️ <b id="army-cap">0/25</b></span>
        <span class="chip" title="Ships / naval capacity">⚓ <b id="fleet-cap">0/4</b></span>
        <span class="chip" title="Total power">⚡ <b id="power">0</b></span>
        <span class="chip" id="shield-chip" hidden title="Peace shield active">🕊️ <b id="shield-time"></b></span>
        <span class="chip sync" id="sync" title="Save status">💾 <b id="sync-label">local</b></span>
        <button class="icon-btn" data-action="help" title="Help (H)">?</button>
        <button class="icon-btn" data-action="settings" title="Settings">⚙️</button>
        <button class="icon-btn" data-action="menu" title="Menu">☰</button>
      </div>
    </header>

    <main id="main">
      <!-- ===== Map stage ===== -->
      <section id="stage-wrap">
        <div class="view-toggle" role="tablist">
          <button class="active" data-view="kingdom" role="tab" title="Kingdom (K)">🏰 Kingdom</button>
          <button data-view="world" role="tab" title="World map (M)">🗺️ World</button>
        </div>
        <div id="alerts"></div>
        <div id="placing-hint" hidden></div>
        <canvas id="stage" aria-label="Game map"></canvas>
        <div class="zoom-ctl">
          <button data-action="zoom-in" title="Zoom in (+)">+</button>
          <button data-action="zoom-out" title="Zoom out (−)">−</button>
          <button data-action="zoom-home" title="Recenter (Space)">🏠</button>
        </div>
        <canvas id="minimap" hidden title="Minimap — click to jump"></canvas>
        <div id="version" title="Game version"></div>
        <div id="tooltip" hidden></div>
      </section>

      <!-- ===== Side panel ===== -->
      <aside id="panel">
        <nav class="tabs" role="tablist">
          <button data-tab="info" class="active"><em id="tab-info-icon">🏗️</em><span id="tab-info-label">Build</span></button>
          <button data-tab="research"><em>🎓</em><span>Research</span></button>
          <button data-tab="army"><em>⚔️</em><span>Army</span></button>
          <button data-tab="navy"><em>⚓</em><span>Navy</span></button>
          <button data-tab="generals"><em>🎖️</em><span>Generals</span></button>
          <button data-tab="shop"><em>🎁</em><span>Shop</span></button>
          <button data-tab="alliance"><em>🤝</em><span>Alliance</span></button>
          <button data-tab="log"><em>📜</em><span>Log</span><i id="log-dot" hidden></i></button>
        </nav>
        <div id="panel-body"></div>
      </aside>
    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <div id="battle" class="modal" hidden>
    <div class="battle-card">
      <div class="battle-head">
        <div id="battle-title">Battle</div>
        <div class="battle-controls">
          <button data-bspeed="1" class="active">1×</button>
          <button data-bspeed="2">2×</button>
          <button data-bspeed="4">4×</button>
          <button id="battle-skip">Skip ⏭</button>
        </div>
      </div>
      <canvas id="battle-canvas" width="960" height="520"></canvas>
      <div id="battle-result" hidden></div>
    </div>
  </div>

  <div id="toasts"></div>

  <!-- Game scripts (classic scripts sharing one global scope; order matters) -->
  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/state.js"></script>
  <script src="js/economy.js"></script>
  <script src="js/military.js"></script>
  <script src="js/research.js"></script>
  <script src="js/world.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/alliances.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/render-common.js"></script>
  <script src="js/render-kingdom.js"></script>
  <script src="js/render-world.js"></script>
  <script src="js/help.js"></script>
  <script src="js/ui-panels.js"></script>
  <script src="js/ui-actions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
